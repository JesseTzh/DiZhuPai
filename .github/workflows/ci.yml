name: CI and GitHub Pages

on:
  pull_request:
  push:
    branches:
      - main
      - test
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Checks and Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Verify Chrome availability
        run: google-chrome --version

      # recordVideo requires Playwright's own bundled ffmpeg; the runner image's
      # system ffmpeg is never consulted and preinstalled Chrome does not cover it.
      - name: Install Playwright ffmpeg
        run: npx playwright install ffmpeg

      # The browser tests drive the game on the development server with branded
      # Chrome (channel: "chrome"), which GitHub runners provide preinstalled.
      # Desktop scripts run at a 1920x1080 viewport so the recording canvas equals
      # the viewport and yields full-bleed 1080p webm (the recorder never upscales
      # frames; a smaller viewport would leave gray padding). mobile-game-browser
      # records an 858x396 landscape (exact 19.5:9) webm and responsive-browser
      # stays unrecorded. longplay-browser replays a full fixed-seed match and is
      # listed last so its ~5 minutes do not delay the other reports.
      # Failures are collected in failed.txt so one red script does not hide the rest.
      - name: Run Playwright browser tests
        run: |
          node scripts/serve.mjs &
          server_pid=$!
          trap 'kill "${server_pid}"' EXIT
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5173/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/ >/dev/null
          mkdir -p test-results
          : > test-results/failed.txt
          status=0
          for t in entry-browser interactions-browser home-browser save-browser browser gameplay-browser items-browser shop-browser mobile-game-browser ui-pages responsive-browser longplay-browser; do
            if ! node "tests/${t}.mjs"; then
              echo "${t}" >> test-results/failed.txt
              status=1
            fi
          done
          # Headless Chrome is required on runners; HEADED=0 opts the
          # performance test into its smoke thresholds (software rasterizing
          # runners cannot hold 60 Hz), and SECONDS trims sampling time.
          if ! HEADED=0 SECONDS=8 node tests/performance-browser.mjs; then
            echo "performance-browser" >> test-results/failed.txt
            status=1
          fi
          exit "${status}"

      # Builds test-results/report/index.html from the recordings, screenshots and
      # failed.txt. The job summary is written later (--no-summary): its video links
      # need the per-video artifacts uploaded below.
      - name: Generate video report
        if: always()
        run: node scripts/video-report.mjs --no-summary

      # Contains the 1080p recordings (test-results/videos), screenshots and the
      # offline report; unzip and open report/index.html in Chrome to replay.
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

      # Each recording is also uploaded as its own non-zipped artifact
      # (upload-artifact v7 archive:false supports a single file; the artifact is
      # named after the file). GitHub renders browser-native types like webm
      # inline, so the ▶ links in the job summary play the video directly instead
      # of forcing a full archive download. Works on PR runs too.
      - name: Upload video · browser
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: test-results/videos/browser.webm
          archive: false
          if-no-files-found: ignore
      - name: Upload video · entry-browser-1920x1080
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: test-results/videos/entry-browser-1920x1080.webm
          archive: false
          if-no-files-found: ignore
      - name: Upload video · entry-browser-858x396
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: test-results/videos/entry-browser-858x396.webm
          archive: false
          if-no-files-found: ignore
      - name: Upload video · gameplay-browser
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: test-results/videos/gameplay-browser.webm
          archive: false
          if-no-files-found: ignore
      - name: Upload video · home-browser
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: test-results/videos/home-browser.webm
          archive: false
          if-no-files-found: ignore
      - name: Upload video · interactions-browser
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: test-results/videos/interactions-browser.webm
          archive: false
          if-no-files-found: ignore
      - name: Upload video · items-browser
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: test-results/videos/items-browser.webm
          archive: false
          if-no-files-found: ignore
      - name: Upload video · longplay-browser
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: test-results/videos/longplay-browser.webm
          archive: false
          if-no-files-found: ignore
      - name: Upload video · mobile-game-browser
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: test-results/videos/mobile-game-browser.webm
          archive: false
          if-no-files-found: ignore
      - name: Upload video · save-browser
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: test-results/videos/save-browser.webm
          archive: false
          if-no-files-found: ignore
      - name: Upload video · shop-browser
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: test-results/videos/shop-browser.webm
          archive: false
          if-no-files-found: ignore
      - name: Upload video · ui-pages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: test-results/videos/ui-pages.webm
          archive: false
          if-no-files-found: ignore

      # Map each webm artifact to its HTML URL (…/actions/runs/<run>/artifacts/<id>)
      # for the summary table; a failure here only costs the inline links.
      - name: Collect video artifact links
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts"
          if ! gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate \
              --jq '.artifacts[] | select(.name | endswith(".webm")) | {key: .name, id: (.id | tostring)}' \
              | jq -s --arg base "$base" 'map({(.key): "\($base)/\(.id)"}) | add // {}' > video-urls.json; then
            echo "::warning::收集视频工件直链失败,summary 将不含在线回放链接"
            echo '{}' > video-urls.json
          fi
          cat video-urls.json

      # Re-runs the report script to append the job summary, now with the
      # per-video ▶ links in the 视频回放 column.
      - name: Write test summary
        if: always()
        run: node scripts/video-report.mjs --summary-only --video-urls video-urls.json

  deploy-pages:
    name: Publish to GitHub Pages
    needs: test
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    env:
      BUILD_CHANNEL: ${{ github.ref_name == 'main' && 'prod' || 'test' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build branch bundle
        run: npm run build

      - name: Restore published site
        id: site
        run: |
          state="$RUNNER_TEMP/pages-state"
          set +e
          git ls-remote --exit-code origin refs/heads/gh-pages
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            git fetch --no-tags origin gh-pages
            git worktree add --detach "$state" FETCH_HEAD
          elif [ "$status" -eq 2 ]; then
            git worktree add --detach "$state" HEAD
            git -C "$state" switch --orphan pages-initial
          else
            exit "$status"
          fi
          if [ -f "$state/index.html" ]; then
            echo "has_production=true" >> "$GITHUB_OUTPUT"
          fi

      # 首次从 test 发布时，用 main 初始化正式版，保留原站点入口。
      - name: Checkout main for first publication
        if: github.ref_name == 'test' && steps.site.outputs.has_production != 'true'
        uses: actions/checkout@v5
        with:
          ref: main
          path: pages-main

      - name: Build initial production site
        if: github.ref_name == 'test' && steps.site.outputs.has_production != 'true'
        working-directory: pages-main
        env:
          BUILD_CHANNEL: prod
        run: |
          npm ci
          npm run build
          cp -a dist/. "$RUNNER_TEMP/pages-state/"

      - name: Merge production and test sites
        run: node scripts/pages-site.mjs dist "$RUNNER_TEMP/pages-state" "$RUNNER_TEMP/pages-site" "$BUILD_CHANNEL"

      # 保存双版本快照。该分支只存构建产物，不触发 CI。
      - name: Save published site snapshot
        run: |
          state="$RUNNER_TEMP/pages-state"
          rsync -a --checksum --delete --exclude=/.git "$RUNNER_TEMP/pages-site/" "$state/"
          git -C "$state" config user.name 'github-actions[bot]'
          git -C "$state" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$state" add --all
          if ! git -C "$state" diff --cached --quiet; then
            git -C "$state" commit -m "Deploy $BUILD_CHANNEL $GITHUB_SHA"
            git push origin "$(git -C "$state" rev-parse HEAD):refs/heads/gh-pages"
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish URL in summary
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "正式版：${PAGE_URL%/}/" >> "$GITHUB_STEP_SUMMARY"
          echo "测试版：${PAGE_URL%/}/test/" >> "$GITHUB_STEP_SUMMARY"
          cat dist/version.json >> "$GITHUB_STEP_SUMMARY"
