name: CI and GitHub Pages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Checks and Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Verify Chrome availability
        run: google-chrome --version

      # The browser tests drive the game on the development server with branded
      # Chrome (channel: "chrome"), which GitHub runners provide preinstalled.
      # Each script records a 1080p webm into test-results/videos; failures are
      # collected in failed.txt so one red script does not hide the rest.
      - name: Run Playwright browser tests
        run: |
          node scripts/serve.mjs &
          server_pid=$!
          trap 'kill "${server_pid}"' EXIT
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5173/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/ >/dev/null
          mkdir -p test-results
          : > test-results/failed.txt
          status=0
          for t in entry-browser interactions-browser home-browser save-browser browser shop-browser ui-pages; do
            if ! node "tests/${t}.mjs"; then
              echo "${t}" >> test-results/failed.txt
              status=1
            fi
          done
          # Headless Chrome is required on runners; HEADED=0 opts the
          # performance test into its smoke thresholds (software rasterizing
          # runners cannot hold 60 Hz), and SECONDS trims sampling time.
          if ! HEADED=0 SECONDS=8 node tests/performance-browser.mjs; then
            echo "performance-browser" >> test-results/failed.txt
            status=1
          fi
          exit "${status}"

      # Builds test-results/report/index.html from the recordings, screenshots and
      # failed.txt; also appends a digest to the job summary when run on CI.
      - name: Generate video report
        if: always()
        run: node scripts/video-report.mjs

      # Contains the 1080p recordings (test-results/videos), screenshots and the
      # offline report; unzip and open report/index.html in Chrome to replay.
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  deploy-pages:
    name: Publish to GitHub Pages
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish URL in summary
        run: echo "地主牌在线试玩：${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
